services:
  qdrant:
    image: qdrant/qdrant:gpu-nvidia-latest
    runtime: nvidia
    restart: always
    container_name: qdrant
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    environment:
      - QDRANT__GPU__INDEXING=1
        #    deploy:
        #      resources:
        #        reservations:
        #          devices:
        #            - driver: nvidia
        #              count: all
        #              capabilities: [gpu]
    volumes:
      - qdrant_data:/qdrant/storage

  hcm202:
    image: jangkuz/hcm202
    restart: always
    container_name: hcm202
    ports:
      - 7979:8000
    environment:
      - QDRANT__URL=qdrant:6333
    depends_on:
      - qdrant

configs:
  qdrant_config:
    content: |
      log_level: INFO

volumes:
  qdrant_data:
